name: deploy

on:
    push:
        branches: [ main ]

# It is important to specify "concurrency" for the workflow,
# to prevent concurrency between different deploys.
concurrency: production_environment

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v4

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.5

            -   name: Install dependencies
                run: composer install

            -   name: Deploy
                uses: deployphp/action@v1
                env:
                    APP_HOSTNAME: ${{ secrets.DEPLOY_HOSTNAME }}
                    APP_REMOTE_USER: ${{ secrets.DEPLOY_REMOTE_USER }}
                with:
                    dep: deploy
                    private-key: ${{ secrets.DEPLOY_PRIVATE_KEY }}
                    #deployer-version: 7.5.12
