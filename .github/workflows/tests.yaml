name: "Tests"

on:
  pull_request: ~
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  phpunit:
    name: "PHPUnit"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U app"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v6

      - name: "Setup PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: pdo_pgsql

      - name: "Add PHPUnit matcher"
        run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: "Install dependencies"
        uses: ramsey/composer-install@v3
        with:
          composer-options: --optimize-autoloader

      - name: Wait for Postgres
        run: |
          until pg_isready -h postgres -p 5432 -U app; do
            echo "Waiting for Postgres..."
            sleep 1
          done

      - name: "Run tests"
        env:
          DATABASE_URL: "postgresql://app:secret@127.0.0.1:5432/app_test?serverVersion=16&charset=utf8"
        run: composer tests -- --colors=always
